unit: cantrip/psychic/dancing-lights
name: "_{Dancing Lights}"
group: "_{Dark Archive}"

inc:
  - copy: cantrip/psychic/dancing-lights
    contents:
      - article: cantrip/psychic/dancing-lights
        title: "_{Dancing Lights}"
        cat: "_{Cantrip} 1"
        contents:
          - dl:
              range: "_{120ft}"
              duration: "_{sustained}"

          - action: 2
            contents:
              - p: "_{Create up to 4 lights, up to 10ft apart.}"

              - action:
                contents:
                  - p:
                    title: "_{Sustain}"
                    content: "_{Move lights up to 60ft. Do not need to stay within range of you or each other.}"

          - box:
            contents:
              - p:
                title: "_{Amp}"
                content: "_{Create a flashing display with all 4 lights in one square. Each creature in a 5ft emanation must save.}"

              - paste: inline-save
                params:
                  save: "_{Fortitude}"
                  success: "_{Dazzled for 1rd, then immune for 1 min}"
                  failure: "_{Dazzled for 1rd; re-save each turn while adjacent}"
                  critical_failure: "_{As failure, plus fascinated for 1rd}"
