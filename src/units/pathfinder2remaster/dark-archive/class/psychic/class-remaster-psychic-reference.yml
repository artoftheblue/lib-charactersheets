# - Oscillating Wave's granted spell list reworked around matched cold/fire pairs
# - True Strike -> Sure Strike,
# - Prying Eye -> Scouting Eye
# - True Seeing -> Truesight
# - Touch of Idiocy -> Stupefy,
# - Mirror Image -> Invisibility
# - Resilient Sphere -> Containment
# - Blade Barrier -> Scintillating Safeguard 
# - Scintillating Pattern -> Confusing Colors 
# - Prismatic Sphere -> Resplendent Mansion
# - Color Spray -> Dizzying Colors 
# - Dimension Door -> Translocate
# - Maze -> Quandary
# - The Distant Grasp: Levitate -> Gravity Well
# - Metamagic -> Spellshape

unit: class/remaster/psychic/reference
name: "_{Psychic Reference}"
group: "_{Dark Archive}"

inc:
  - at: '@reference/class-details'
    add:
      - h4: "_{Psychic}"
      - p: >
          _{The mind can perceive truths hidden to fine-tuned instruments, house more secrets
          than any tome, and move objects and hearts more deftly than any lever. By delving into
          both the conscious and subconscious aspects of your inner self, you have awoken to the
          might of psychic magic, allowing you to cast spells not through incantations or gestures
          but by the power of your will alone. While the thin line between your mind and reality
          means that a single errant thought could have unintended consequences for yourself and
          your companions, you know that anything is possible, if you can imagine it.}
        size: large
      - p:
        title: "_{During combat encounters...}"
        optional: true
        content: >
          _{You rely on your collection of psychic cantrips as a mainstay, choosing where and when
          to amplify them for maximum effect. You weave your more conventional spells into the fray
          where more complex magic is needed, unleashing your mind's full potential in a blaze of
          power when the time is right.}
      - p:
        title: "_{During social encounters...}"
        optional: true
        content: >
          _{You navigate situations guided by the source of your subconscious power. If your power
          springs from your personality, you might maneuver with empathy and sociability; if it's
          more cerebral, you might provide a steady logical front.}
      - p:
        title: "_{While exploring...}"
        optional: true
        content: >
          _{You keep your mind's eye open for the many paranormal threats that those who are less
          sensitive might not detect. Typically, you either scan for magic or investigate for
          psychic impressions, veiled thoughts, and wandering spirits.}

      - paste: book-ref
        params:
          page-ref: "_{DA p9}"

  - at: '@reference/actions'
    add:
      - action: free
        contents:
          - p:
            title: "_{Unleash Psyche}"
            content: "_{Your turn begins, you Cast a Spell last turn, and you aren't stupefied. Your psyche is Unleashed for 2 rounds.}"

  - at: '@reference/action-traits'
    add:
      - amp
      - mindshift
      - psyche
