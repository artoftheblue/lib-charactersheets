unit: remaster/psychic/subconscious/wandering-reverie
in: remaster/psychic/subconscious
group: "_{Dark Archive}"
name: "_{Wandering Reverie}"

inc:
  - set: psychic-subconscious
    value: "_{Wandering Reverie}"

  - set: key-ability
    value: CHA

  - at: '@class/remaster/psychic:subconscious-mind/title'
    replace:
      - h4: "_{Wandering Reverie}"
        size: small
  - at: '@class/remaster/psychic:subconscious-mind/body'
    replace:
      - action:
        title: "_{Fade Into Daydreams}"
        contents:
          - p: "_{Concealed until the start of your next turn.}"
