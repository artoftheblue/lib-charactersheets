unit: cantrip/dancing-blade
name: "_{Dancing Blade}"
group: "_{Dark Archive}"

inc:
  - copy: cantrip/dancing-blade
    contents:
      - article: cantrip/dancing-blade
        title: "_{Dancing Blade}"
        cat: "_{Cantrip} 5"
        contents:
          - dl:
              range: "_{30ft}"
              duration: "_{Sustain up to 1 minute}"

          - action: 2
            contents:
              - p: "_{Animate a weapon. It strikes in the first turn, then sticks with its target.}"

          - action:
            contents:
              - p:
                title: "_{Sustain}"

              - ul:
                contents:
                  - li:
                    contents:
                      - p:
                        title: "_{Change Partners}"
                        content: "_{Flies to a new target within 30ft.}"
                  - li:
                    contents:
                      - p:
                        title: "_{Strike}"
                        content: "_{Use your spell attack roll}"

          - calc:
            merge-bottom: false
            output:
              field: "##:damage"
              legend: "_{Damage}"
              border: full
              width: large
              suffix: "_{d6}"
              eq: "3+%{##:heighten}"
            inputs:
              - span: "3 +"
              - field: "##:heighten"
                label: "_{Heighten +2}"
                width: small

  - copy: cantrip/dancing-blade/amp
    contents:
      - box:
        contents:
          - p:
            title: "_{Amp}"

          - calc:
            merge-bottom: false
            output:
              field: "##:damage"
              legend: "_{Damage}"
              border: full
              width: large
              suffix: "_{d10}"
              eq: "3+%{##:heighten}"
            inputs:
              - span: "3 +"
              - field: "##:heighten"
                label: "_{Heighten +2}"
                width: small

          - action:
            contents:
              - ul:
                contents:
                  - li:
                    contents:
                      - p:
                        title: "_{Guard}"
                        content: "_{+2 AC against melee from the target}"
                  - li:
                    contents:
                      - p:
                        title: "_{Push}"
                        content: "_{Use spell attack roll to Push}"
