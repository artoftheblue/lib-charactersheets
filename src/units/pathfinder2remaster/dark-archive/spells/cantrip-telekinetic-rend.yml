unit: cantrip/telekinetic-rend
name: "_{Telekinetic Rend}"
group: "_{Dark Archive}"

inc:
  - copy: cantrip/telekinetic-rend
    contents:
      - article: cantrip/telekinetic-rend
        title: "_{Telekinetic Rend}"
        cat: "_{Cantrip} 1"
        contents:
          - dl:
              range: "_{60ft}"
              area: "_{2 non-overlapping 5ft bursts}"

          - action: 2
            contents:
              - p: "_{Deal damage to all creatures in area. A creature large enough to be in more than one burst takes damage only once.}"

              - flags:
                  - "_{Bludgeoning}"
                  - "_{Slashing}"

          - calc:
            output:
              field: "##:damage"
              legend: "_{Damage}"
              border: full
              width: large
              suffix: "_{d6}"
              eq: "floor((%{##:spell-level}+1)/2)"
            inputs:
              - field: "##:spell-level"
                label: "_{Spell Level}"
                eq: "ceil(%{level}/2)"

          - paste: basic-save
            params:
              save: "_{Fortitude}"

  - copy: cantrip/telekinetic-rend/amp
    contents:
      - box:
        contents:
          - p:
            title: "_{Amp}"
            content: "_{Deal both bludgeoning and slashing damage. A target that critically fails its save is also stunned 1.}"

          - calc:
            output:
              field: "##:damage"
              legend: "_{Damage}"
              border: full
              width: large
              suffix: "_{d6}"
              eq: "floor((%{##:spell-level}+1)/2)"
            inputs:
              - field: "##:spell-level"
                label: "_{Spell Level}"
                eq: "ceil(%{level}/2)"

          - p: "_{At higher rank, also gain a third non-overlapping 5ft burst.}"
