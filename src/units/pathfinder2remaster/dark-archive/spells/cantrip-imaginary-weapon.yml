unit: cantrip/imaginary-weapon
name: "_{Imaginary Weapon}"
group: "_{Dark Archive}"

inc:
  - copy: cantrip/imaginary-weapon
    contents:
      - article: cantrip/imaginary-weapon
        title: "_{Imaginary Weapon}"
        cat: "_{Cantrip} 1"
        contents:
          - dl:
              range: "_{touch}"

          - action: 2
            contents:
              - p: "_{Make a melee attack.}"

          - calc:
            merge-bottom: false
            output:
              field: "##:damage"
              legend: "_{Force Damage}"
              border: full
              width: large
              suffix: "_{d6}"
              eq: "%{##:spell-level}+1"
            inputs:
              - field: "##:spell-level"
                label: "_{Spell Level}"
                eq: "ceil(%{level}/2)"
              - span: "+ 1"

  - copy: cantrip/imaginary-weapon/amp
    contents:
      - box:
        contents:
          - p:
            title: "_{Amp}"

          - action: 2
            contents:
              - p: "_{Make two melee attacks against different targets.}"

          - calc:
            output:
              field: "##:amp/damage"
              legend: "_{Force Damage}"
              border: full
              width: large
              suffix: "_{d6}"
              eq: "%{##:spell-level}*2"
            inputs:
              - field: "##:spell-level"
                label: "_{Spell Level}"
                eq: "ceil(%{level}/2)"
              - span: "&times; 2"
