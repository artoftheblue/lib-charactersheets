unit: feat/bard/bardic-lore
group: "_{Player Core}"
name: "_{Bardic Lore}"

inc:
  - set: bardic-lore-proficiency
    value: trained

  - at: '@skills'
    add:
      - skill: bardic-lore
        name: "_{Bardic Lore}"
        attribute: "_{INT}"
        attributeref: INT
        acp: false

  - copy: feat/bard/bardic-lore
    contents:
      - article:
        title: "_{Bardic Lore}"
        cat: "_{Feat}"
        contents:
          - p: "_{Trained in Bardic Lore, which can be used to recall knowledge in any subject.}"
          - p: "_{When you reach legendary in Occultism, you gain expert in Bardic Lore. You cannot increase it by any other means.}"
