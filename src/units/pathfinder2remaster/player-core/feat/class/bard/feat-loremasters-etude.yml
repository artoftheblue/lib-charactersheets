unit: feat/bard/loremasters-etude
group: "_{Player Core}"
name: "_{Loremaster's Etude}"

inc:
  - copy: feat/bard/loremasters-etude
    contents:
      - article:
        title: "_{Loremaster's Etude}"
        cat: "_{Focus} 1"
        contents:
          - paste: focus
            contents:
              - action: free
                contents:
                  - flags:
                      - "_{Fortune}"
                      - "_{Manipulate}"
                  - dl:
                      trigger: "_{You or an ally within range attempts a Recall Knowledge check}"
                      range: "_{30ft}"
                      target: "_{You or the triggering ally}"
                  - p: "_{Roll the triggering check twice and use the higher result.}"
