unit: feat/bard/lingering-composition
group: "_{Player Core}"
name: "_{Lingering Composition}"

inc:
  - copy: feat/bard/lingering-composition
    contents:
      - article:
        title: "_{Lingering Composition}"
        cat: "_{Focus} 1"
        contents:
          - paste: focus
            contents:
              - action: free
                contents:
                  - flags:
                      - "_{Concentrate}"
                      - "_{Spellshape}"
                  - p: "_{Cast a cantrip composition with a 1 round duration, while making a Performance check.}"
                  - dl:
                    div: true
                    defs:
                      critical_success: "_{Lasts 4 rounds}"
                      success: "_{Lasts 3 rounds}"
                      failure: "_{Lasts 1 round, but costs no focus}"
