              area: "_{60ft emanation}"
              duration: "_{1rd}"
          - action:
            contents:
              - value-block: "+1"
                content: "_{To attack, damage and saves against fear for allies.}"
          - paste: book-ref
            params:
              page-ref: "_{PC p370}"
