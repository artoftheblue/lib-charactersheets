unit: class/remaster/bard/defs
group: "_{Player Core}"
name: "_{Bard}"

inc:
  - copy: bard-muse
    params:
      name: ""
      feat: ""
      spell: ""
    contents:
      - set: subclass
        value: "#{name}"

      - at: '@bard/muse'
        replace:
          - h4: "#{name}"
            size: small

      - at: '@bard/muse/bonus-feat'
        replace:
          - paste: "#{feat}"

      - at: '@spellbook/middle/first'
        add:
          - paste: "#{spell}"
