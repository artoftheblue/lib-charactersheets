unit: druid/order/remaster/leaf
in: druid/order
group: "_{Player Core}"
name: "_{Leaf}"

require:
  - unit: option/familiar
  
inc:
  - set: subclass
    value: "_{Leaf}"

  - set: diplomacy-proficiency
    value: trained

  - at: '@druid/order'
    replace:
      - h4: "_{Leaf Order}"

  - at: '@druid/order-feat'
    replace:
      - article: "##:feat/leshy-familiar"
        title: "_{Leshy Familiar}"
        cat: "_{Feat}"
        contents:
          - p: "_{Gain a leshy familiar with a plant or fungus familiar ability, not counting against your usual limit.}"

  - at: '@focus-spells'
    add:
      - action: 2
        contents:
          - p:
            title: "_{Cornucopia}"
            content: "_{Conjure a piece of produce that heals when eaten.}"

  - at: '@druid/order-power'
    replace:
      - section: "_{Cornucopia}"
        contents:
          - paste: focus
            contents:
              - p: "_{Conjure a piece of produce that heals when eaten.}"
              - row:
                contents:
                  - calc:
                    output:
                      field: cornucopia-produce
                      legend: "_{Produce}"
                      width: large
                      eq: "%{focus-level}"
                    inputs:
                      - label: "_{Focus Level}"

                  - spacer:
                  - field: cornucopia-healing
                    label: "Healing"
                    control: value
                    value: "_{1d6}+4"
                    width: large

  - at: '@focus-points'
    replace:
      - field: druid-leaf-cornucopia-focus
        label: "_{Leaf Order}"

  - at: '@anathema'
    replace:
      - li: "_{Committing wanton cruelty to plants or fungi}"
      - li: "_{Killing plants or fungi unnecessarily}"
