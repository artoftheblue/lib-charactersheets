unit: remaster/champion/cause/desecration
in: remaster/champion/cause
group: "_{Player Core 2}"
name: "_{Desecration}"

inc:
  - set: subclass
    value: "_{Desecration}"
  - set: champion-cause
    value: "_{Desecration}"
  - set: champion-unholy
    value: true

  - at: '@champion/class-name'
    replace:
      - class-name: "_{Desecration}"
        suffix: "_{Champion of}"

  - at: '@edicts'
    add:
      - li: "_{Subvert or corrupt anything pure or holy in your path.}"
      - li: "_{Sow doubt among believers in purity or holiness.}"

  - at: '@advancement'
    add:
      - level: 1
        advance: "_{Selfish Shield}"

  - at: '@actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Selfish Shield}"
            content: "_{When an enemy damages you, gain resistance and deal extra spirit damage to it.}"

  - at: '@reference/actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Selfish Shield}"
            content: "_{When an enemy damages you, gain resistance and deal extra spirit damage to it.}"

  - at: '@champion/reaction'
    replace:
      - section: "_{Selfish Shield}"
        contents:
          - list:
            hr: true
            contents:
              - action: reaction
                contents:
                  - g:
                    pad: true
                    contents:
                      - p: "_{An enemy in your aura damages you: gain resistance to that damage, regardless of type.}"
                      - calc:
                        output:
                          field: champion-desecration-selfish-shield-resistance
                          legend: "_{Resistance}"
                          width: large
                          prefix: "+"
                          eq: "2+floor(%{level}/2)"
                        inputs:
                          - span: "2 + ("
                          - field:
                            ref: level
                            label: "_{Level}"
                          - span: "&divide; 2)"
                      - p: "_{Until your next turn, Strikes against that creature deal extra spirit damage.}"
                      - table:
                        flip: true
                        rows:
                          - level: 1
                            damage: "+1"
                          - level: 9
                            damage: "+2"
                          - level: 16
                            damage: "+3"
                        columns:
                          - label: "_{Level}"
                            rotate: true
                          - label: "_{Extra\nDamage}"
                            rotate: true
                        template:
                          - level-marker: "#{level}"
                            marker: ""
                          - value: "#{damage}"

              - level: 9
                contents:
                  - g:
                    pad: true
                    contents:
                      - h5: "_{Relentless Reaction}"
                      - p: "_{If CHA modifier is +3 or greater, resistance instead equals CHA modifier + half level.}"
                      - calc:
                        output:
                          field: champion-desecration-selfish-shield-resistance-relentless
                          legend: "_{Resistance}"
                          width: large
                          prefix: "+"
                          eq: "%{CHA}+floor(%{level}/2)"
                        inputs:
                          - field:
                            ref: CHA
                            label: "_{CHA}"
                            underlay: "_{CHA}"
                          - span: "+ ("
                          - field:
                            ref: level
                            label: "_{Level}"
                          - span: "&divide; 2)"

              - level: 11
                contents:
                  - g:
                    pad: true
                    contents:
                      - h5: "_{Exalted Reaction}"
                      - p: "_{Each enemy in your aura takes -1 status to attack rolls against you until your next turn.}"
