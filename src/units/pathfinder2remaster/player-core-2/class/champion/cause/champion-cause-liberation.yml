unit: remaster/champion/cause/liberation
in: remaster/champion/cause
group: "_{Player Core 2}"
name: "_{Liberation}"

inc:
  - set: subclass
    value: "_{Liberation}"
  - set: champion-cause
    value: "_{Liberation}"

  - at: '@champion/class-name'
    replace:
      - class-name: "_{Liberation}"
        suffix: "_{Champion of}"

  - at: '@edicts'
    add:
      - li: "_{Oppose slavery and tyranny; fight for others' freedom to choose.}"
      - li: "_{Respect choices others make for their own lives.}"

  - at: '@anathema'
    add:
      - li: "_{Force or threaten someone to act a certain way, or engage in slavery or tyranny.}"

  - at: '@advancement'
    add:
      - level: 1
        advance: "_{Liberating Step}"

  - at: '@actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Liberating Step}"
            content: "_{Free an ally from a restraining or damaging effect.}"

  - at: '@reference/actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Liberating Step}"
            content: "_{Free an ally from a restraining or damaging effect.}"

  - at: '@champion/reaction'
    replace:
      - section: "_{Liberating Step}"
        contents:
          - list:
            hr: true
            contents:
              - action: reaction
                contents:
                  - dl:
                      trigger: "_{An enemy within 15ft damages, grabs, or grapples your ally.}"
                  - p: "_{They gain resistance and choose one:}"
                  - ul:
                    contents:
                      - li: "_{[b]New Save[/b]: attempt a new save against the triggering effect.}"
                      - li:
                        contents:
                          - p:
                            icon: free-action
                            content: "_{[b]Escape[/b]: attempt to Escape.}"
                  - p: "_{Either way, the ally can Step as a free action if able to move.}"
                    size: small
                  - calc:
                    output:
                      field: champion-liberation-liberating-step-resistance
                      legend: "_{Resistance}"
                      width: large
                      prefix: "+"
                      eq: "2+%{level}"
                    inputs:
                      - span: "2 +"
                      - field:
                        ref: level
                        label: "_{Level}"

              - level: 9
                contents:
                  - h5: "_{Relentless Reaction}"
                  - p: "_{If the foe grabbed, restrained, immobilised, or paralysed your ally, it takes persistent spirit damage:}"
                  - calc:
                    output:
                      field: champion-divine-smite-liberation
                      legend: "_{Damage}"
                      suffix: "_{pts}"
                      width: large
                      eq: "%{CHA}"
                    inputs:
                      - field:
                        ref: CHA
                        label: "_{CHA}"
                        underlay: "_{CHA}"

              - level: 11
                contents:
                  - h5: "_{Exalted Reaction}"
                  - p: "_{You and other allies in your aura can also Step as a free action, even if the freed ally can't move.}"
