unit: remaster/oracle/mystery/ancestors
in: remaster/oracle/mystery
group: "_{Player Core 2}"
name: "_{Ancestors}"

inc:
  - set: subclass
    value: "_{Ancestors}"
  - set: oracle-mystery
    value: "_{Ancestors}"

  - set: society-proficiency
    value: trained

  - at: '@oracle/mystery/title'
    replace:
      - h4: "_{Ancestors}"

  - set: oracle-mystery-skill
    value: "_{Society}"
  - set: oracle-mystery-domains
    value: "_{Death, Duty*, Family, Soul*}"
  - set: oracle-mystery-feat
    value: "_{Whispers of Weakness}"

  - set: oracle-revelation-spell-initial
    value: "_{Ancestral Touch}"
  - set: oracle-revelation-spell-advanced
    value: "_{Ancestral Defence}"
  - set: oracle-revelation-spell-greater
    value: "_{Ancestral Form}"

  - at: '@oracle/spells-list/granted-cantrip'
    replace:
      - "_{Guidance}"

  - at: '@oracle/spells-list/granted-spells'
    replace:
      - "_{Ill Omen}"
      - "_{Ghostly Carrier}"
      - ""
      - ""
      - "_{Dreaming Potential}"
      - ""
      - ""
      - ""
      - ""

  - at: '@oracle/revelation-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Ancestral Touch}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  range: "_{Touch}"
                  target: "_{1 living creature}"
                  save: "_{Will}"
              - p: "_{Force the target to see and feel your surrounding ancestors.}"
              - calc:
                output:
                  field: "##:ancestral-touch/damage"
                  legend: "_{Mental\nDamage}"
                  width: large
                  suffix: "_{d4}"
                  icon: d4
                  eq: "%{focus-rank}+1"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
                  - span: "+1"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Half damage.}"
                  failure: "_{Frightened 1; full damage.}"
                  critical_failure: "_{Frightened 2; double damage.}"

  - at: '@oracle/revelation-spell/advanced'
    replace:
      - action: reaction
        contents:
          - article:
            title: "_{Ancestral Defence}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  trigger: "_{You are about to attempt a Will save.}"
              - p: "_{Roll the triggering Will save twice; use the better result.}"

  - at: '@oracle/revelation-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Ancestral Form}"
            cat: "_{Focus 6}"
            contents:
              - dl:
                  duration: "_{Sustained up to 1 minute}"
              - p: "_{Become invisible and quasi-corporeal. Resistance 10 to all damage (except force, spirit, ghost touch Strikes), doubled vs. non-magical damage or precision Strikes.}"
              - p: "_{Fly Speed equal to land Speed (moving upward isn't difficult terrain). Can float through tiny gaps but not solid objects. Can't Cast Spells (Sustain is fine), activate items, or use attack/manipulate actions.}"

  - at: '@oracle/mystery/curse-title'
    replace:
      - h4: "_{Curse of Ancestral Meddling}"
        size: small

  - at: '@oracle/mystery/curse'
    replace:
      - flags:
        contents:
          - "_{Curse}"
          - "_{Divine}"
          - "_{Oracle}"
          - "_{Spirit}"
      - row:
        contents:
          - calc:
            output:
              field: oracle-mystery-ancestors-clumsy
              legend: "_{Clumsy}"
              width: large
              eq: "%{oracle-cursebound}"
            inputs:
              - field:
                ref: oracle-cursebound
                label: "_{Cursebound}"
