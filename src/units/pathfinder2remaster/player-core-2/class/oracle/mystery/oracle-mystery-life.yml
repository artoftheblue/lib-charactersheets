unit: remaster/oracle/mystery/life
in: remaster/oracle/mystery
group: "_{Player Core 2}"
name: "_{Life}"

inc:
  - set: subclass
    value: "_{Life}"
  - set: oracle-mystery
    value: "_{Life}"

  - set: medicine-proficiency
    value: trained

  - at: '@oracle/mystery/title'
    replace:
      - h4: "_{Life}"

  - set: oracle-mystery-skill
    value: "_{Medicine}"
  - set: oracle-mystery-domains
    value: "_{Death, Healing, Pain, Soul*}"
  - set: oracle-mystery-feat
    value: "_{Nudge the Scales}"

  - set: oracle-revelation-spell-initial
    value: "_{Life Link}"
  - set: oracle-revelation-spell-advanced
    value: "_{Delay Affliction}"
  - set: oracle-revelation-spell-greater
    value: "_{Life-Giving Form}"

  - at: '@oracle/spells-list/granted-cantrip'
    replace:
      - "_{Vitality Lash}"

  - at: '@oracle/spells-list/granted-spells'
    replace:
      - "_{Soothe}"
      - "_{False Vitality}"
      - ""
      - ""
      - "_{Grisly Growths}"
      - ""
      - ""
      - ""
      - ""

  - at: '@oracle/revelation-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Life Link}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  range: "_{30 feet}"
                  target: "_{1 creature other than you}"
                  duration: "_{1 minute}"
              - p: "_{Links you and the target: on cast, target heals 1d4 HP.}"
              - p: "_{The first damage the target takes each round is reduced (min 0); you lose that much HP, unmitigated. Ends if you fall unconscious. Dismissible.}"
              - advancement:
                index: "_{Focus Level}"
                elide: true
                fields:
                  - key: targets
                    name: "_{Targets}"
                    format: string
                  - key: healing
                    name: "_{Initial healing}"
                    format: string
                  - key: hp
                    name: "_{Reduction / HP lost}"
                    format: string
                advances:
                  - level: 1
                    targets: 1
                    healing: "_{1d4}"
                    hp: "_{3}"
                  - level: 3
                    targets: 2
                    healing: "_{3d4}"
                    hp: "_{5}"
                  - level: 6
                    targets: 3
                    healing: "_{6d4}"
                    hp: "_{10}"
                  - level: 9
                    targets: 4
                    healing: "_{9d4}"
                    hp: "_{15}"

  - at: '@oracle/revelation-spell/advanced'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Delay Affliction}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  range: "_{30 feet}"
                  target: "_{1 creature}"
              - p: "_{Counteract one affliction you're aware the target has (name not required), suspending it for 1 hour on a success instead of removing it, plus minor healing. Target then immune for 1 day.}"
              - row:
                contents:
                  - calc:
                    output:
                      field: "##:delay-affliction/healing"
                      legend: "_{Healing}"
                      width: large
                      suffix: "_{d8}"
                      icon: d8
                      eq: "%{focus-rank}"
                    inputs:
                      - field:
                        label: "_{Focus Level}"
                        ref: focus-rank
                      - span: "&times; _{1d8}"
                  - vr:
                  - calc:
                    output:
                      field: "##:delay-affliction/afflictions"
                      legend: "_{Afflictions suspended}"
                      width: large
                      eq: "%{focus-rank}-2"
                    inputs:
                      - field:
                        label: "_{Focus Level}"
                        ref: focus-rank
                      - span: "- 2"

  - at: '@oracle/revelation-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Life-Giving Form}"
            cat: "_{Focus 6}"
            contents:
              - dl:
                  duration: "_{1 minute}"
              - p: "_{Become a beacon of healing: bright light like a torch, unarmed Strikes deal +1d4 vitality damage. A vitality healing effect - can't heal yourself. Dismissible.}"
              - list:
                hr: true
                light: true
                contents:
                  - g:
                    contents:
                      - p: "_{You gain resistance to precision damage and weakness to void damage.}"
                      - calc:
                        output:
                          field: "##:life-giving-form/resistance"
                          legend: "_{Resistance/ Weakness}"
                          width: large
                          eq: "%{focus-rank}-1"
                        inputs:
                          - field:
                            label: "_{Focus Level}"
                            ref: focus-rank
                          - span: "- 1"
                  - g:
                    contents:
                      - action:
                        contents:
                          - p: "_{Touch a living creature (or let one touch you) to restore HP; then immune to this healing for 1 minute.}"
                      - calc:
                        output:
                          field: "##:life-giving-form/healing"
                          legend: "_{Healing}"
                          width: large
                          suffix: "_{d8}"
                          icon: d8
                          eq: "%{focus-rank}"
                        inputs:
                          - field:
                            label: "_{Focus Level}"
                            ref: focus-rank
                          - span: "&times; _{1d8}"
                  - g:
                    contents:
                      - p: "_{Creatures harmed by vitality damage (e.g. undead) that touch you or hit you with unarmed/non-reach melee take vitality damage instead, without becoming immune.}"
                      - calc:
                        output:
                          field: "##:life-giving-form/reactive-damage"
                          legend: "_{Vitality damage}"
                          width: large
                          prefix: "_{3d4} +"
                          eq: "%{focus-rank}-6"
                        inputs:
                          - field:
                            label: "_{Focus Level}"
                            ref: focus-rank

  - at: '@oracle/mystery/curse-title'
    replace:
      - h4: "_{Curse of Outpouring Life}"
        size: small

  - at: '@oracle/mystery/curse'
    replace:
      - flags:
        contents:
          - "_{Curse}"
          - "_{Divine}"
          - "_{Oracle}"
      - p: "_{Magical healing you receive is reduced by your level (min 1) x cursebound value.}"
      - row:
        contents:
          - calc:
            output:
              field: oracle-mystery-life-healing-penalty
              legend: "_{Healing Penalty}"
              width: large
              eq: "%{level}*%{oracle-cursebound}"
            inputs:
              - field:
                ref: level
                label: "_{Level}"
              - span: "&times;"
              - field:
                ref: oracle-cursebound
                label: "_{Cursebound}"
