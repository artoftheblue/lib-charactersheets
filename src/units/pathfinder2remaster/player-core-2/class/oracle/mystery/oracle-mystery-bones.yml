unit: remaster/oracle/mystery/bones
in: remaster/oracle/mystery
group: "_{Player Core 2}"
name: "_{Bones}"

inc:
  - set: subclass
    value: "_{Bones}"
  - set: oracle-mystery
    value: "_{Bones}"

  - set: medicine-proficiency
    value: trained

  - at: '@oracle/mystery/title'
    replace:
      - h4: "_{Bones}"

  - set: oracle-mystery-skill
    value: "_{Medicine}"
  - set: oracle-mystery-domains
    value: "_{Death, Decay*, Undeath, Vigil*}"
  - set: oracle-mystery-feat
    value: "_{Nudge the Scales}"

  - set: oracle-revelation-spell-initial
    value: "_{Soul Siphon}"
  - set: oracle-revelation-spell-advanced
    value: "_{Armor of Bones}"
  - set: oracle-revelation-spell-greater
    value: "_{Claim Undead}"

  - at: '@oracle/spells-list/granted-cantrip'
    replace:
      - "_{Void Warp}"

  - at: '@oracle/spells-list/granted-spells'
    replace:
      - "_{Grim Tendrils}"
      - "_{False Vitality}"
      - "_{Ghostly Weapon}"
      - ""
      - ""
      - ""
      - ""
      - ""
      - ""

  - at: '@oracle/revelation-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Soul Siphon}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  range: "_{30ft}"
                  target: "_{1 living creature}"
                  save: "_{Fortitude}"
              - p: "_{Gain temp HP equal to the target's total HP lost, including from becoming drained.}"
              - calc:
                output:
                  field: "##:soul-siphon/damage"
                  legend: "_{Void\nDamage}"
                  width: large
                  suffix: "_{d4}"
                  icon: d4
                  eq: "%{focus-rank}"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Half damage.}"
                  failure: "_{Full damage; drained 1.}"
                  critical_failure: "_{Double damage; drained 2.}"

  - at: '@oracle/revelation-spell/advanced'
    replace:
      - action:
        contents:
          - article:
            title: "_{Armor of Bones}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  duration: "_{1 minute}"
              - p: "_{Your form ossifies, gaining bone's durability.}"
              - calc:
                output:
                  field: "##:armor-of-bones/resistance"
                  legend: "_{Resistance to\ncold, electricity, fire,\npiercing, slashing}"
                  width: large
                  eq: "%{focus-rank}"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"

  - at: '@oracle/revelation-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Claim Undead}"
            cat: "_{Focus 6}"
            contents:
              - dl:
                  range: "_{30ft}"
                  target: "_{1 undead creature}"
                  save: "_{Will}"
                  duration: "_{10 minutes}"
              - p: "_{Wrest control of a target undead. If controlled by another creature, that controller saves to retain control; otherwise the target saves.}"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Stunned 1 and confused for 1 round.}"
                  failure: "_{Controlled by you; new save each turn ends the spell on a success (then stunned 1, confused 1 round).}"
                  critical_failure: "_{As failure, but new saves only if you order against its nature.}"

  - at: '@oracle/mystery/curse-title'
    replace:
      - h4: "_{Curse of Living Death}"
        size: small

  - at: '@oracle/mystery/curse'
    replace:
      - flags:
        contents:
          - "_{Curse}"
          - "_{Divine}"
          - "_{Oracle}"
          - "_{Void}"
          - "_{Vitality}"
      - list:
        hr: true
        light: true
        contents:
          - g:
            contents:
              - p:
                title: "_{Cursebound 1}"
                content: "_{Vitality and void damage both affect you regardless of normal immunity; such immunity/resistance is suppressed.}"
              - value-block: "2"
                content: "_{Weakness to vitality and void damage}"
          - g:
            contents:
              - p:
                title: "_{Cursebound 2}"
              - value-block: "-1"
                content: "_{status penalty to Fortitude saves}"
          - level: 11
            contents:
              - g:
                contents:
                  - p:
                    title: "_{Cursebound 3}"
                  - calc:
                    output:
                      field: oracle-mystery-bones-weakness
                      legend: "_{Weakness to\nvitality and void}"
                      width: large
                      eq: "5+%{level}"
                    inputs:
                      - field:
                        ref: level
                        label: "_{Level}"
          - level: 17
            contents:
              - g:
                contents:
                  - p:
                    title: "_{Cursebound 4}"
                  - value-block: "-2"
                    content: "_{status penalty to Fortitude saving throws}"
