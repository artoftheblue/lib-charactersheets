unit: remaster/oracle/mystery/flames
in: remaster/oracle/mystery
group: "_{Player Core 2}"
name: "_{Flames}"

inc:
  - set: subclass
    value: "_{Flames}"
  - set: oracle-mystery
    value: "_{Flames}"

  - set: acrobatics-proficiency
    value: trained

  - at: '@oracle/mystery/title'
    replace:
      - h4: "_{Flames}"

  - set: oracle-mystery-skill
    value: "_{Acrobatics}"
  - set: oracle-mystery-domains
    value: "_{Dust*, Fire, Star*, Sun}"
  - set: oracle-mystery-feat
    value: "_{Foretell Harm}"

  - set: oracle-revelation-spell-initial
    value: "_{Incendiary Aura}"
  - set: oracle-revelation-spell-advanced
    value: "_{Whirling Flames}"
  - set: oracle-revelation-spell-greater
    value: "_{Flaming Fusillade}"

  - at: '@oracle/spells-list/granted-cantrip'
    replace:
      - "_{Ignition}"

  - at: '@oracle/spells-list/granted-spells'
    replace:
      - "_{Breathe Fire}"
      - "_{Blazing Bolt}"
      - "_{Fireball}"
      - ""
      - ""
      - ""
      - ""
      - ""
      - ""

  - at: '@oracle/revelation-spell/initial'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Incendiary Aura}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  area: "_{10-foot emanation}"
                  duration: "_{1 minute}"
              - p: "_{A combustible aura surrounds you; creatures in it that take fire damage catch fire.}"
              - calc:
                output:
                  field: "##:incendiary-aura/damage"
                  legend: "_{Persistent\nFire Damage}"
                  width: large
                  suffix: "_{d4}"
                  icon: d4
                  eq: "floor((%{focus-rank}-1)/2)+2"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - p: "_{Heightened (+2): radius +5ft.}"

  - at: '@oracle/revelation-spell/advanced'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Whirling Flames}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  range: "_{30ft}"
                  area: "_{Up to two 5-foot bursts that don't overlap}"
                  save: "_{Basic Reflex}"
              - p: "_{Whirling flames engulf creatures in the area.}"
              - calc:
                output:
                  field: "##:whirling-flames/damage"
                  legend: "_{Fire\nDamage}"
                  width: large
                  suffix: "_{d6}"
                  icon: d6
                  eq: "floor((%{focus-rank}-3)/2)*3+5"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - p: "_{Heightened (+2): you can add another nonoverlapping 5-foot burst to the area.}"

  - at: '@oracle/revelation-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Flaming Fusillade}"
            cat: "_{Focus 6}"
            contents:
              - dl:
                  duration: "_{1 minute}"
              - p: "_{Miniature-sun explosions burst around you. You cast Ignition as part of this spell; for the duration, Ignition costs 1 action instead of 2.}"
              - p: "_{Heightened (9th): Ignition also gains a status bonus to damage equal to this spell's rank, for the duration.}"

  - at: '@oracle/mystery/curse-title'
    replace:
      - h4: "_{Curse of Engulfing Flames}"
        size: small

  - at: '@oracle/mystery/curse'
    replace:
      - flags:
        contents:
          - "_{Curse}"
          - "_{Divine}"
          - "_{Fire}"
          - "_{Oracle}"
      - p: "_{While cursebound: on fire, taking persistent fire damage (flameless heat if it can't burn, e.g. underwater). Subsides while Refocusing or unconscious; resumes if interrupted or you wake.}"
      - row:
        contents:
          - calc:
            output:
              field: oracle-mystery-flames-persistent-damage
              legend: "_{Persistent Fire\nDamage}"
              width: large
              eq: "%{oracle-cursebound}"
            inputs:
              - field:
                ref: oracle-cursebound
                label: "_{Cursebound}"
