unit: remaster/oracle/mystery/flames
in: remaster/oracle/mystery
group: "_{Player Core 2}"
name: "_{Flames}"

inc:
  - set: subclass
    value: "_{Flames}"
  - set: oracle-mystery
    value: "_{Flames}"

  - set: acrobatics-proficiency
    value: trained

  - at: '@oracle/mystery/title'
    replace:
      - h4: "_{Flames}"

  - set: oracle-mystery-skill
    value: "_{Acrobatics}"
  - set: oracle-mystery-domains
    value: "_{Dust*, Fire, Star*, Sun}"
  - set: oracle-mystery-feat
    value: "_{Foretell Harm}"
  - set: oracle-mystery-granted-spells
    value: "_{Cantrip: ignition. 1st: breathe fire. 2nd: blazing bolt. 3rd: fireball.}"

  - set: oracle-revelation-spell-initial
    value: "_{Incendiary Aura}"
  - set: oracle-revelation-spell-advanced
    value: "_{Whirling Flames}"
  - set: oracle-revelation-spell-greater
    value: "_{Flaming Fusillade}"

  - at: '@oracle/spells-list/granted-cantrip'
    replace:
      - "_{Ignition}"

  - at: '@oracle/spells-list/granted-spells'
    replace:
      - "_{Breathe Fire}"
      - "_{Blazing Bolt}"
      - "_{Fireball}"
      - ""
      - ""
      - ""
      - ""
      - ""
      - ""

  - at: '@oracle/revelation-spell/initial'
    replace:
      - action: reaction
        contents:
          - article:
            title: "_{Incendiary Aura}"
            cat: "_{Focus 1}"
            contents:
              - p: "_{Surround yourself with a corona of flame, dealing fire damage to a creature that damages you in melee.}"

  - at: '@oracle/revelation-spell/advanced'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Whirling Flames}"
            cat: "_{Focus 4}"
            contents:
              - p: "_{Call forth a whirlwind of fire around you, dealing fire damage to all creatures in an emanation.}"

  - at: '@oracle/revelation-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Flaming Fusillade}"
            cat: "_{Focus 8}"
            contents:
              - p: "_{Hurl a volley of blazing bolts at multiple foes within range, each dealing fire damage.}"

  - at: '@oracle/mystery/curse'
    replace:
      - h4: "_{Curse of Engulfing Flames}"
        size: small
      - flags:
        contents:
          - "_{Curse}"
          - "_{Divine}"
          - "_{Fire}"
          - "_{Oracle}"
      - p: "_{Fires flare noticeably (though not dangerously) in your presence, you occasionally smoke slightly, and your body is almost painfully hot to the touch.}"
      - p: "_{While cursebound, you catch fire, taking persistent fire damage equal to your cursebound value. The flames shed light like a torch, and if you enter an environment where they could not burn (such as underwater), you simply seethe with flameless heat. The flames subside when you begin Refocusing to assuage your curse or if you fall unconscious, but they resume if your Refocus activity is interrupted or when you return to consciousness.}"
      - row:
        contents:
          - field: oracle-mystery-flames-persistent-damage
            legend: "_{Persistent Fire Damage}"
            border: full
            width: large
          - p: "_{Equal to your cursebound value.}"
