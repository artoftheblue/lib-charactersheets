unit: remaster/oracle/mystery/cosmos
in: remaster/oracle/mystery
group: "_{Player Core 2}"
name: "_{Cosmos}"

inc:
  - set: subclass
    value: "_{Cosmos}"
  - set: oracle-mystery
    value: "_{Cosmos}"

  - set: nature-proficiency
    value: trained

  - at: '@oracle/mystery/title'
    replace:
      - h4: "_{Cosmos}"

  - set: oracle-mystery-skill
    value: "_{Nature}"
  - set: oracle-mystery-domains
    value: "_{Darkness, Moon, Nothingness*, Star*}"
  - set: oracle-mystery-feat
    value: "_{Oracular Warning}"
  - set: oracle-mystery-granted-spells
    value: "_{Cantrip: light. 1st: dizzying colors. 2nd: darkness. 5th: moon frenzy.}"

  - set: oracle-revelation-spell-initial
    value: "_{Spray of Stars}"
  - set: oracle-revelation-spell-advanced
    value: "_{Interstellar Void}"
  - set: oracle-revelation-spell-greater
    value: "_{Moonlight Bridge}"

  - at: '@oracle/spells-list/granted-cantrip'
    replace:
      - "_{Light}"

  - at: '@oracle/spells-list/granted-spells'
    replace:
      - "_{Dizzying Colors}"
      - "_{Darkness}"
      - ""
      - ""
      - "_{Moon Frenzy}"
      - ""
      - ""
      - ""
      - ""

  - at: '@oracle/revelation-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Spray of Stars}"
            cat: "_{Focus 1}"
            contents:
              - p: "_{Fling a spray of tiny, brilliant stars at your foes, dealing fire damage in a cone and dazzling creatures caught within it.}"

  - at: '@oracle/revelation-spell/advanced'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Interstellar Void}"
            cat: "_{Focus 4}"
            contents:
              - p: "_{Envelop a foe in the cold void between the stars, dealing cold damage and slowing it.}"

  - at: '@oracle/revelation-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Moonlight Bridge}"
            cat: "_{Focus 8}"
            contents:
              - p: "_{Conjure a shimmering bridge of moonlight that allows you and your allies to walk on air.}"

  - at: '@oracle/mystery/curse'
    replace:
      - h4: "_{Curse of the Sky's Call}"
        size: small
      - flags:
        contents:
          - "_{Curse}"
          - "_{Divine}"
          - "_{Oracle}"
      - p: "_{Your body is drawn toward the heavens, making you lighter and less substantial than you should be. Your eyes glow with starry light, and your hair and clothing float and drift around you.}"
      - p: "_{While cursebound, you are enfeebled and take a status penalty to saves and DCs against all forms of forced movement, each equal to your cursebound value.}"
      - row:
        contents:
          - field: oracle-mystery-cosmos-enfeebled
            legend: "_{Enfeebled}"
            border: full
            width: large
          - vr:
          - field: oracle-mystery-cosmos-forced-movement
            legend: "_{Forced Movement Penalty}"
            border: full
            width: large
          - p: "_{Both equal to your cursebound value.}"
