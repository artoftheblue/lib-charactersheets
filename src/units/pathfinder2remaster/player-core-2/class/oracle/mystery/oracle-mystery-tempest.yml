unit: remaster/oracle/mystery/tempest
in: remaster/oracle/mystery
group: "_{Player Core 2}"
name: "_{Tempest}"

inc:
  - set: subclass
    value: "_{Tempest}"
  - set: oracle-mystery
    value: "_{Tempest}"

  - set: nature-proficiency
    value: trained

  - at: '@oracle/mystery/title'
    replace:
      - h4: "_{Tempest}"

  - set: oracle-mystery-skill
    value: "_{Nature}"
  - set: oracle-mystery-domains
    value: "_{Air, Cold, Lightning*, Water}"
  - set: oracle-mystery-feat
    value: "_{Foretell Harm}"

  - set: oracle-revelation-spell-initial
    value: "_{Tempest Touch}"
  - set: oracle-revelation-spell-advanced
    value: "_{Thunderburst}"
  - set: oracle-revelation-spell-greater
    value: "_{Tempest Form}"

  - at: '@oracle/spells-list/granted-cantrip'
    replace:
      - "_{Electric Arc}"

  - at: '@oracle/spells-list/granted-spells'
    replace:
      - "_{Thunderstrike}"
      - ""
      - ""
      - "_{Hydraulic Torrent}"
      - ""
      - "_{Chain Lightning}"
      - ""
      - ""
      - ""

  - at: '@oracle/revelation-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Tempest Touch}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  range: "_{Touch}"
                  target: "_{1 creature}"
                  save: "_{Fortitude}"
              - calc:
                output:
                  field: "##:tempest-touch/damage"
                  legend: "_{Bludgeoning +\nCold Damage}"
                  width: large
                  suffix: "_{d4 each}"
                  icon: d4
                  eq: "%{focus-rank}"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Half damage; -5ft Speed until your next turn.}"
                  failure: "_{Full damage; -10ft Speed until your next turn.}"
                  critical_failure: "_{Double damage; as failure.}"

  - at: '@oracle/revelation-spell/advanced'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Thunderburst}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  range: "_{100ft}"
                  area: "_{20-foot burst}"
                  save: "_{Fortitude}"
              - calc:
                output:
                  field: "##:thunderburst/damage"
                  legend: "_{Bludgeoning +\nSonic Damage}"
                  width: large
                  suffix: "_{d6 each}"
                  icon: d6
                  eq: "floor((%{focus-rank}-3)/2)*2+2"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Half damage.}"
                  failure: "_{Full damage; deafened for 1 minute.}"
                  critical_failure: "_{Double damage; deafened for 1 hour.}"
              - p: "_{Heightened (+2): area +5ft.}"

  - at: '@oracle/revelation-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Tempest Form}"
            cat: "_{Focus 6}"
            contents:
              - dl:
                  duration: "_{Sustained up to 1 minute}"
              - p: "_{Become air, water, or mist: amorphous, unarmored AC, resistance 10 physical, immune to precision. No Cast Spells/attack/manipulate except this spell's.}"
              - list:
                hr: true
                light: true
                contents:
                  - p:
                    title: "_{Air}"
                    content: "_{Fly 20ft, invisible in air. 2-action: gust of wind.}"
                  - p:
                    title: "_{Mist}"
                    content: "_{Fly 20ft, hard to see through; attackers through you are concealed.}"
                  - p:
                    title: "_{Water}"
                    content: "_{Swim 20ft, invisible in water. 1-action: lose invisibility; melee attacks take 1d6 electricity.}"
              - p: "_{Heightened (+2): resistance +5; water form's electricity damage +1.}"

  - at: '@oracle/mystery/curse-title'
    replace:
      - h4: "_{Curse of Inclement Headwinds}"
        size: small

  - at: '@oracle/mystery/curse'
    replace:
      - flags:
        contents:
          - "_{Curse}"
          - "_{Divine}"
          - "_{Oracle}"
      - list:
        hr: true
        light: true
        contents:
          - g:
            contents:
              - p:
                title: "_{Cursebound 1}"
                content: "_{Treated as wearing metal for electricity/metal-rider effects; metal immunity/resistance suppressed.}"
              - value-block: "2"
                content: "_{Electricity weakness}"
          - g:
            contents:
              - p:
                title: "_{Cursebound 2}"
              - value-block: "-2"
                content: "_{circumstance penalty to ranged attack rolls}"
          - level: 11
            contents:
              - g:
                contents:
                  - p:
                    title: "_{Cursebound 3}"
                  - calc:
                    output:
                      field: oracle-mystery-tempest-weakness
                      legend: "_{Electricity\nweakness}"
                      width: large
                      eq: "5+%{level}"
                    inputs:
                      - field:
                        ref: level
                        label: "_{Level}"
          - level: 17
            contents:
              - g:
                contents:
                  - p:
                    title: "_{Cursebound 4}"
                  - value-block: "-10 ft"
                    content: "_{status penalty to all Speeds}"
