unit: remaster/oracle/mystery/tempest
in: remaster/oracle/mystery
group: "_{Player Core 2}"
name: "_{Tempest}"

inc:
  - set: subclass
    value: "_{Tempest}"
  - set: oracle-mystery
    value: "_{Tempest}"

  - set: nature-proficiency
    value: trained

  - at: '@oracle/mystery/title'
    replace:
      - h4: "_{Tempest}"

  - set: oracle-mystery-skill
    value: "_{Nature}"
  - set: oracle-mystery-domains
    value: "_{Air, Cold, Lightning*, Water}"
  - set: oracle-mystery-feat
    value: "_{Foretell Harm}"
  - set: oracle-mystery-granted-spells
    value: "_{Cantrip: electric arc. 1st: thunderstrike. 4th: hydraulic torrent. 6th: chain lightning.}"

  - set: oracle-revelation-spell-initial
    value: "_{Tempest Touch}"
  - set: oracle-revelation-spell-advanced
    value: "_{Thunderburst}"
  - set: oracle-revelation-spell-greater
    value: "_{Tempest Form}"

  - at: '@oracle/spells-list/granted-cantrip'
    replace:
      - "_{Electric Arc}"

  - at: '@oracle/spells-list/granted-spells'
    replace:
      - "_{Thunderstrike}"
      - ""
      - ""
      - "_{Hydraulic Torrent}"
      - ""
      - "_{Chain Lightning}"
      - ""
      - ""
      - ""

  - at: '@oracle/revelation-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Tempest Touch}"
            cat: "_{Focus 1}"
            contents:
              - p: "_{Touch a creature to lash it with wind and rain, dealing damage and knocking it off-balance.}"

  - at: '@oracle/revelation-spell/advanced'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Thunderburst}"
            cat: "_{Focus 4}"
            contents:
              - p: "_{Call down a crack of thunder around a target, dealing sonic damage and deafening creatures nearby.}"

  - at: '@oracle/revelation-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Tempest Form}"
            cat: "_{Focus 8}"
            contents:
              - p: "_{Transform into a living storm, gaining resistances and the ability to fly.}"

  - at: '@oracle/mystery/curse'
    replace:
      - h4: "_{Curse of Inclement Headwinds}"
        size: small
      - flags:
        contents:
          - "_{Curse}"
          - "_{Divine}"
          - "_{Oracle}"
      - p: "_{The weather always seems to oppose you, in ways large and small. Even at rest, your hair and clothing are blown about by gentle winds, you're slightly damp from a faint drizzle, and your touch carries a static shock.}"
      - list:
        hr: true
        light: true
        contents:
          - p:
            title: "_{Cursebound 1}"
            content: "_{Lightning is drawn to you. You gain electricity weakness 2 and electricity spells or effects that have additional effects for a creature wearing or holding metal treat you as though you were wearing metal. Any immunity or resistance you have to such spells and effects is suppressed.}"
          - p:
            title: "_{Cursebound 2}"
            content: "_{Blowing winds impose a -2 circumstance penalty to ranged attack rolls you make.}"
          - level: 11
            contents:
              - p:
                title: "_{Cursebound 3}"
                content: "_{Your weakness to electricity is equal to 5 plus your level.}"
          - level: 17
            contents:
              - p:
                title: "_{Cursebound 4}"
                content: "_{The raging winds push you back, imposing a -10-foot status penalty to all your Speeds.}"
