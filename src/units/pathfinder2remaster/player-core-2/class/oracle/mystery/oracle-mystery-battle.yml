unit: remaster/oracle/mystery/battle
in: remaster/oracle/mystery
group: "_{Player Core 2}"
name: "_{Battle}"

inc:
  - set: subclass
    value: "_{Battle}"
  - set: oracle-mystery
    value: "_{Battle}"

  - set: athletics-proficiency
    value: trained

  - at: '@oracle/mystery/title'
    replace:
      - h4: "_{Battle}"

  - set: oracle-mystery-skill
    value: "_{Athletics}"
  - set: oracle-mystery-domains
    value: "_{Destruction, Might, Protection, Zeal}"
  - set: oracle-mystery-feat
    value: "_{Oracular Warning}"
  - set: oracle-mystery-granted-spells
    value: "_{Cantrip: shield. 1st: sure strike. 2nd: telekinetic maneuver. 4th: weapon storm.}"

  - set: oracle-revelation-spell-initial
    value: "_{Weapon Trance}"
  - set: oracle-revelation-spell-advanced
    value: "_{Battlefield Persistence}"
  - set: oracle-revelation-spell-greater
    value: "_{Revel in Retribution}"

  - at: '@oracle/spells-list/granted-cantrip'
    replace:
      - "_{Shield}"

  - at: '@oracle/spells-list/granted-spells'
    replace:
      - "_{Sure Strike}"
      - "_{Telekinetic Maneuver}"
      - ""
      - "_{Weapon Storm}"
      - ""
      - ""
      - ""
      - ""
      - ""

  - at: '@oracle/revelation-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Weapon Trance}"
            cat: "_{Focus 1}"
            contents:
              - p: "_{Enter a battle trance, gaining a status bonus to attack rolls with a chosen weapon or unarmed attack.}"

  - at: '@oracle/revelation-spell/advanced'
    replace:
      - action:
        contents:
          - article:
            title: "_{Battlefield Persistence}"
            cat: "_{Focus 4}"
            contents:
              - p: "_{Steel yourself against the chaos of war, gaining resistance to damage from attacks and area effects.}"

  - at: '@oracle/revelation-spell/greater'
    replace:
      - action: reaction
        contents:
          - article:
            title: "_{Revel in Retribution}"
            cat: "_{Focus 8}"
            contents:
              - p: "_{When a creature damages you, lash out with a Strike against it.}"

  - at: '@oracle/mystery/curse'
    replace:
      - h4: "_{Curse of the Mortal Warrior}"
        size: small
      - flags:
        contents:
          - "_{Curse}"
          - "_{Divine}"
          - "_{Oracle}"
      - p: "_{You thrive in battle, but your mystery's focus on the physical leaves your soul weak against spellcraft. You smell of steel and blood, look more imposing and muscular than you are, and always hear the faint clash of distant battle.}"
      - list:
        hr: true
        light: true
        contents:
          - p:
            title: "_{Cursebound 1}"
            content: "_{Weakness 2 to any damage dealt by a spell. Any immunity or resistance you have to spells is suppressed. This applies only to spells, not other magical abilities.}"
          - p:
            title: "_{Cursebound 2}"
            content: "_{-1 status penalty to saving throws against spells.}"
          - level: 11
            contents:
              - p:
                title: "_{Cursebound 3}"
                content: "_{Your weakness to spells is equal to your level.}"
          - level: 17
            contents:
              - p:
                title: "_{Cursebound 4}"
                content: "_{Your status penalty to saving throws against spells increases to -2.}"
