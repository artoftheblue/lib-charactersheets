unit: class/bard/defs
group: "_{Core Rulebook}"
name: "_{Bard}"

inc:
  - copy: bard-muse
    params:
      name: ""
      feat: ""
      spell: ""
    contents:
      - set: subclass
        value: "#{name}"

      - at: '@bard/muse'
        replace:
          - h4: "#{name}"
            size: small

      - at: '@bard/muse/bonus-feat'
        replace:
          - paste: "#{feat}"

      - at: '@spellbook/middle/first'
        add:
          - paste: "#{spell}"
