unit: cantrip/shatter-mind
name: "_{Shatter Mind}"
group: "_{Dark Archive}"

inc:
  - copy: cantrip/shatter-mind
    contents:
      - article: cantrip/shatter-mind
        title: "_{Shatter Mind}"
        cat: "_{Cantrip} 3"
        contents:
          - dl:
              area: "_{15ft cone}"

          - action: 2
            contents:
              - p: "_{Deal mental damage to all enemies in area.}"

          - calc:
            output:
              field: "##:damage"
              legend: "_{Mental Damage}"
              border: full
              width: huge
              control: compound
              parts:
                - subid: dice
                  eq: "%{##:spell-level}-1"
                  suffix: "d4 +"
                - subid: bonus
                  eq: "%{##:ability}"
            inputs:
              - span: "("
              - field: "##:spell-level"
                label: "_{Spell Level}"
                eq: "ceil(%{level}/2)"
              - span: "- 1 ) d4 +"
              - field: "##:ability"
                label: "_{Spellcasting Ability Modifier}"
                ref: true

          - paste: basic-save
            params:
              save: "_{Will}"

  - copy: cantrip/shatter-mind/amp
    contents:
      - box:
        contents:
          - p:
            title: "_{Amp}"
        
          - dl:
              area: "_{30ft or 60ft cone}"

          - calc:
            output:
              field: "##:damage"
              legend: "_{Mental Damage}"
              border: full
              width: huge
              control: compound
              parts:
                - subid: dice
                  eq: "%{##:spell-level}-1"
                  suffix: "d10 +"
                - subid: bonus
                  eq: "%{##:ability}"
            inputs:
              - span: "("
              - field: "##:spell-level"
                label: "_{Spell Level}"
                eq: "ceil(%{level}/2)"
              - span: "- 1 ) d10 +"
              - field: "##:ability"
                label: "_{Spellcasting Ability Modifier}"
                ref: true

          - row:
            contents:  
              - p: "_{Stupefied 1}"
                icon: save-fail

              - p: "_{Stupefied 2}"
                icon: save-crit-fail
          
