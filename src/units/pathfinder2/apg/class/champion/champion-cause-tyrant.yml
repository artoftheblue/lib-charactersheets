unit: champion/cause/apg/tyrant
in: champion/cause
order: 7
group: "_{Advanced Player's Guide}"
name: "_{Tyrant}"
badge: "_{Lawful Evil}"

require:
  - unit: champion/devotion-spell/touch-of-corruption

inc:
  - set: class
    value: "_{Tyrant}"
  - set: 'champion-cause-name'
    value: '_{Tyrant}'
  - set: cause
    value: "_{Tyrant}"

  - at: '@champion/class-name'
    replace:
      - class-name: "_{Tyrant}"
        preface: "_{Champion}"
        suffix: "_{of}"

  - at: '@champion/cause-section'
    replace:
      - section: "_{Cause}"
        primary: true
        contents:
          - list:
            contents:
              - layout: alignment
                contents:
                  - g:
                    contents:
                      - field: cause
                        width: stretch
                        size: huge
                        frame: none
                      - field: cause-detail
                        width: stretch
                        frame: none
                  - field: cause-alignment
                    control: alignment
                    frame: none
              - g:
                contents:
                  - h5: "_{Tenets}"
                  - ul:
                    contents:
                      - li: "_{Never commit a purely good act (charity, using good spells/items).}"
                      - li: "_{Never put others before yourself, or yourself before your deity.}"
                      - li: "_{Let no one lesser than you wield power over you or lead you.}"
                      - li: "_{Enforce legitimate hierarchies; topple illegitimate ones (democracies, celestial echelons) and seize the power yourself.}"
                      - li: "_{Bind the weak to serve you.}"
                  - h5: "_{Anathema}"
                  - paste: anathema
                    params:
                      merge-bottom: false
                  - p: "_{Violating your code costs your focus pool and divine ally until you repent.}"

  - at: '@advancement'
    add:
      - level: 1
        advance: "_{Iron Command}"

  - at: '@actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Iron Command}"
            content: "_{Command an enemy to kneel before you}"

  - at: '@reference/actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Iron Command}"
            content: "_{Command an enemy to kneel before you}"

  - at: '@champion/reaction-section'
    replace:
      - section: "_{Iron Command}"
        contents:
          - list:
            hr: true
            contents:
              - action: reaction
                contents:
                  - p: "_{Enemy within 15ft damages you: command it to kneel.}"
                  - ul:
                    contents:
                      - li:
                        contents:
                          - p:
                            icon: free-action
                            content: "_{[b]Kneel[/b]: the enemy drops prone.}"
                      - li: "_{[b]Refuse[/b]: the enemy takes mental damage.}"
                  - table:
                    flip: true
                    rows:
                      - level: 1
                        damage: "_{1d6}"
                      - level: 5
                        damage: "_{2d6}"
                      - level: 9
                        damage: "_{3d6}"
                      - level: 12
                        damage: "_{4d6}"
                      - level: 16
                        damage: "_{5d6}"
                      - level: 19
                        damage: "_{6d6}"
                    columns:
                      - label: "_{Level}"
                        rotate: true
                      - label: "_{Mental\nDamage}"
                        rotate: true
                    template:
                      - level-marker: "#{level}"
                        marker: ""
                      - value: "#{damage}"
                  - p: "_{Your Strikes deal extra evil/negative damage next turn.}"
                  - table:
                    flip: true
                    rows:
                      - level: 1
                        damage: "+1"
                      - level: 9
                        damage: "+2"
                      - level: 16
                        damage: "+3"
                    columns:
                      - label: "_{Level}"
                        rotate: true
                      - label: "_{Damage}"
                        rotate: true
                    template:
                      - level-marker: "#{level}"
                        marker: ""
                      - value: "#{damage}"
              - level: 9
                contents:
                  - h5: "_{Divine Smite}"
                  - p: "_{Refusal also deals persistent evil damage:}"
                  - g:
                    pad: true
                    contents:
                      - calc:
                        output:
                          field: champion-divine-smite-iron-command
                          legend: "_{Persistent\nDamage}"
                          width: large
                          eq: "%{CHA}"
                        inputs:
                          - field:
                            ref: CHA
                            label: "_{CHA}"
                            underlay: "_{CHA}"
              - level: 11
                contents:
                  - h5: "_{Exalt}"
                  - p: "_{Other enemies within 15ft must kneel or take damage.}"
                  - table:
                    flip: true
                    rows:
                      - level: 11
                        damage: "3"
                      - level: 12
                        damage: "4"
                      - level: 16
                        damage: "5"
                      - level: 19
                        damage: "6"
                    columns:
                      - label: "_{Level}"
                        rotate: true
                      - label: "_{Mental\nDamage}"
                        rotate: true
                    template:
                      - level-marker: "#{level}"
                        marker: ""
                      - value: "#{damage}"
