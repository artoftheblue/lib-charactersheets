unit: oracle/mystery/tempest
in: oracle/mystery
group: "_{Advanced Player's Guide}"
name: "_{Tempest}"

inc:
  - set: subclass
    value: "_{Tempest}"

  - set: oracle-mystery
    value: "_{Tempest}"
  - set: nature-proficiency
    value: trained

  - at: '@oracle/mystery/title'
    replace:
      - h4: "_{Tempest}"

  - at: '@oracle/mystery/benefit'
    replace:
      - g:
        contents:
          - p: "_{No penalty to Perception from wind, rain, fog, etc, or from looking through water or being underwater, and such conditions don't cause anything to be concealed from you.}"
          - hr:
            light: true
          - p: "_{Air and water damage spells deal extra electricity damage equal to spell level.}"

  - set: oracle/mystery/cantrip
    value: "_{Electric Arc}"
  - set: oracle/mystery/initial-revelation
    value: "_{Tempest Touch}"
  - set: oracle/mystery/advanced-revelation
    value: "_{Thunderburst}"
  - set: oracle/mystery/greater-revelation
    value: "_{Tempest Form}"

  # SPELLS
  - at: '@oracle/revelation-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Tempest Touch}"
            contents:
              - dl:
                  range: "_{Touch}"
                  target: "_{1 creature}"
                  save: "_{Fortitude}"
              - calc:
                output:
                  field: "##:tempest-touch/damage"
                  legend: "_{Bludgeoning/ Cold Damage}"
                  width: gargantuan
                  control: compound
                  parts:
                    - width: large
                      suffix: "d4 +"
                      eq: "%{focus-level}"
                    - width: large
                      suffix: "d4"
                      eq: "%{focus-level}"
                inputs:
                  - field:
                    label: "_{Focus level}"
                    ref: focus-level
              - paste: save
                params:
                  critical_success: "_{No effect}"
                  success: "_{Half damage, -5ft Speed until your next turn}"
                  failure: "_{Full damage, -10ft Speed until your next turn}"
                  critical_failure: "_{Double damage}"

  - at: '@oracle/revelation-spell/advanced'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Thunderburst}"
            contents:
              - dl:
                  range: "_{100ft}"
                  area: "_{20ft burst}"
                  save: "_{Fortitude}"

              - paste: heighten
                params:
                  level: "3"
                  heighten: "+2"
              - calc:
                output:
                  field: "##:thunderburst/damage"
                  legend: "_{Bludgeoning/ Sonic Damage}"
                  width: gargantuan
                  control: compound
                  parts:
                    - width: large
                      suffix: "d6 +"
                      eq: "2+(%{##:thunderburst/heighten}*2)"
                    - width: large
                      suffix: "d6"
                      eq: "2+(%{##:thunderburst/heighten}*2)"
                inputs:
                  - span: "_{2d6} +"
                  - field: "##:thunderburst/heighten"
                    label: "_{Heighten}"
                    ref: true
                  - span: "&times; 2d6"

              - paste: save
                params:
                  critical_success: "_{No effect}"
                  success: "_{Half damage}"
                  failure: "_{Full damage, deafened for 1 minute}"
                  critical_failure: "_{Double damage, deafened for 1 hour}"
              - p: "_{Heightened (+2): area +5ft.}"

  - at: '@oracle/revelation-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Tempest Form}"
            contents:
              - dl:
                  duration: "_{Sustained up to 1 minute}"
              - p: "_{Become air, water, or mist: amorphous, unarmoured AC, resistance 10 physical, immune to precision. No spells/attack/manipulate except this spell's.}"
              - list:
                hr: true
                light: true
                contents:
                  - p:
                    title: "_{Air}"
                    content: "_{Fly 20ft, invisible in air. 2-action: gust of wind.}"
                  - p:
                    title: "_{Mist}"
                    content: "_{Fly 20ft, hard to see through; attackers through you are concealed.}"
                  - p:
                    title: "_{Water}"
                    content: "_{Swim 20ft, invisible in water. 1-action: lose invisibility; melee attacks take 1d6 electricity.}"
              - p: "_{Heightened (+2): resistance +5; water form's electricity damage +1.}"

  - at: '@oracle/spellbook/focus-header'
    add:
      - paste: focus-level

  # CURSE
  - at: '@oracle/curse'
    replace:
      - h4: "_{Curse of the Perpetual Storm}"
        size: small

  - at: '@oracle/curse/minor'
    replace:
      - dl:
          "Aura": "_{5ft}"
      - p: "_{Fires within aura are extinguished by the tempest.}"
      - value-block: "2"
        content: "_{Weakness to electricity.}"
      - p: "_{Treated as wearing metal.}"

  - at: '@oracle/curse/moderate'
    replace:
      - dl:
          "Aura": "_{10ft}"
      - value-block: "_{-2}"
        content: "_{Ranged weapon attack rolls.}"
      - row:
        contents:
          - calc:
            output:
              field: "##:curse/moderate/electricity-weakness"
              legend: "_{Weakness to\nelectricity}"
              width: large
              eq: "max(5,floor(%{level}/2))"
            inputs:
              - field:
                ref: level
                label: "_{Level}"
          - vr:
          - calc:
            output:
              field: "##:curse/moderate/fire-resistance"
              legend: "_{Resistance to\nfire}"
              width: large
              eq: "max(5,floor(%{level}/2))"
            inputs:
              - field:
                ref: level
                label: "_{Level}"

  - at: '@oracle/curse/major'
    replace:
      - dl:
          "Aura": "_{15ft}"
      # - value-block: "_{15ft}"
      #   content: "_{Storm aura.}"
      - p: "_{Aura is difficult terrain for Large-or-smaller creatures and Huge-or-smaller fliers.}"
      - value-block: "_{1d6}"
        content: "_{Damage to any creature that touches you.}"
